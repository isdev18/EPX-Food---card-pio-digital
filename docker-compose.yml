services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bella_massa
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bella_massa_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bella_massa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bella_massa_data:
